<h1 class="auth-title">Entrar</h1>
<form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error(); as failure) {
    <div class="alert" role="alert">
      <mat-icon>error</mat-icon>
      <span>
        {{ failure.message }}
        @if (failure.code === 'email_not_confirmed') {
          <a routerLink="/register" [queryParams]="{ confirm: form.controls.email.value }">
            Confirmar e-mail
          </a>
        }
      </span>
    </div>
  }

  <mat-form-field>
    <mat-label>E-mail</mat-label>
    <input matInput id="email" type="email" formControlName="email" autocomplete="email" />
    <mat-icon matSuffix>mail</mat-icon>
    <mat-error>Informe um e-mail válido.</mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Senha</mat-label>
    <input
      matInput
      id="password"
      [type]="showPassword() ? 'text' : 'password'"
      formControlName="password"
      autocomplete="current-password"
    />
    <button
      matIconButton
      matSuffix
      type="button"
      [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
      (click)="showPassword.set(!showPassword())"
    >
      <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
    <mat-error>Informe sua senha.</mat-error>
  </mat-form-field>

  <button matButton="filled" type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Entrando…' : 'Entrar' }}
  </button>

  <div class="auth-links">
    <a matButton routerLink="/forgot-password">Esqueci minha senha</a>
    <a matButton routerLink="/register">Criar conta</a>
  </div>
</form>
