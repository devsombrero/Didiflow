<div class="shell">
  <nav class="sidebar" aria-label="Navegação principal">
    <p class="sidebar__brand">DidiFlow</p>
    <ul class="sidebar__nav">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          >Dashboard</a
        >
      </li>
      <li>
        <a routerLink="/tasks" routerLinkActive="active">Tarefas</a>
      </li>
      <li>
        <a routerLink="/kpis" routerLinkActive="active">KPIs</a>
      </li>
      <li>
        <a routerLink="/goals" routerLinkActive="active">Metas</a>
      </li>
      <li>
        <a routerLink="/time" routerLinkActive="active">Tempo</a>
      </li>
      <li>
        <a routerLink="/organization" routerLinkActive="active">Organização</a>
      </li>
      <li>
        <a routerLink="/settings" routerLinkActive="active">Configurações</a>
      </li>
    </ul>
    <app-timer-widget />
    <div class="sidebar__user">
      <span class="sidebar__name">{{
        profileService.profile()?.display_name || user()?.email
      }}</span>
      <button type="button" class="btn btn--link" (click)="signOut()">Sair</button>
    </div>
  </nav>
  <main class="content">
    <router-outlet />
  </main>
</div>
